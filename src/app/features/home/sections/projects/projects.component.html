<section class="py-24 px-6 bg-base-100">
  <div class="max-w-4xl mx-auto">
    <h2 class="text-3xl font-bold text-center mb-12">{{ 'projects.title' | transloco }}</h2>
    <div class="flex justify-center overflow-x-auto pb-4">
      <div class="flex gap-6">
        @for (project of projects; track project.url) {
          <div class="card bg-base-200 w-80 shrink-0">
            <div class="card-body">
              <h3 class="card-title">{{ project.titleKey | transloco }}</h3>
              <p class="text-base-content/70 flex-1">{{ project.descriptionKey | transloco }}</p>
              <div class="card-actions justify-end mt-4">
                <a
                  [href]="project.url"
                  target="_blank"
                  rel="noopener"
                  class="btn btn-primary btn-sm"
                >
                  {{ project.ctaKey | transloco }}
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                </a>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
