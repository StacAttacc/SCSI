<section
  class="hero min-h-screen"
  style="background-image: url('https://picsum.photos/seed/scsi/1920/1080');"
>
  <div class="hero-overlay bg-opacity-65"></div>
  <div class="hero-content text-center text-neutral-content max-w-2xl">
    <div>
      <h1 class="text-6xl font-bold tracking-tight mb-2">SCSI</h1>
      <p class="text-base uppercase tracking-widest mb-8 opacity-70">Services Conseils Sensaroli Inc.</p>
      <p class="text-2xl font-medium mb-4">{{ 'hero.tagline' | transloco }}</p>
      <p class="text-lg mb-10 opacity-80">{{ 'hero.description' | transloco }}</p>
      <a href="#pourquoi" class="btn btn-primary btn-lg">
        {{ 'hero.cta' | transloco }}
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </a>
    </div>
  </div>
</section>
